name: customer
description: "Kaziony customer app: browse offers, claim and pick up"
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Only our own packages. Everything else comes through kernel and stellar
  # (see tool/check_imports.sh). intl is needed by the generated translations.
  kernel: any
  stellar: any
  offers_api: any
  intl: any
  # Not imported: picks the Google Maps iOS plugin that works with Swift
  # Package Manager (iOS 15+). Plugins only take this choice from the app.
  google_maps_flutter_ios_sdk9: ^2.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # The app's own pictures (CustomerIllustrations), with 2.0x and 3.0x.
  assets:
    - assets/illustrations/
