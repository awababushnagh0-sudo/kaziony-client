name: partner
description: "Offers partner app for store owners and staff"
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Only our own packages. Everything else comes through kernel and stellar
  # (see tool/check_imports.sh). intl is needed by the generated translations.
  kernel: any
  stellar: any
  offers_api: any
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/illustrations/
