# Every push and pull request: the checks run before a commit
# (tool/check_all.sh: import rules, analyzer and tests in every package and
# app), formatting, and every app builds for where it ships: the dashboard
# for the web (kept for the Deploy dashboard workflow), the store and
# customer apps for Android and iOS. On main, the Android builds are signed
# with our upload key and kept, ready for Google Play.
#
# A build's number is the count of commits up to it: it only goes up on
# main, as the stores require, and says which commit a build came from.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The version pinned for everyone (.fvmrc).
      - id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatting (not the generated code)
        run: |
          git ls-files -z '*.dart' | grep -zv '/generated/' |
            xargs -0 dart format --output=none --set-exit-if-changed
      - run: tool/check_all.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dashboard
        working-directory: apps/admin
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: >-
          flutter build web --release --build-number="$BUILD_NUMBER"
          --dart-define-from-file=config/prod.json
      - uses: actions/upload-artifact@v7
        with:
          name: admin-web
          path: apps/admin/build/web
          retention-days: 30
          if-no-files-found: error

  android:
    strategy:
      fail-fast: false
      matrix:
        app: [partner, customer]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP: ${{ matrix.app }}
      RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      # From the repo's secrets (README, Releases). Pull requests don't get
      # them, so they're signed with a throwaway key, only to check they build.
      - name: Upload key
        if: env.RELEASE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::The ANDROID_UPLOAD_KEYSTORE and ANDROID_UPLOAD_KEY_PASSWORD secrets are missing (README, Releases)."
            exit 1
          fi
          base64 --decode <<<"$KEYSTORE" >"$RUNNER_TEMP/upload.jks"
          printf '%s\n' "storeFile=$RUNNER_TEMP/upload.jks" "storePassword=$PASSWORD" \
            keyAlias=upload "keyPassword=$PASSWORD" >"apps/$APP/android/key.properties"
      - name: Android
        working-directory: apps/${{ matrix.app }}
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          flutter build apk --release --build-number="$BUILD_NUMBER" \
            --dart-define-from-file=config/prod.json
          if [ "$RELEASE" = true ]; then
            flutter build appbundle --release --build-number="$BUILD_NUMBER" \
              --dart-define-from-file=config/prod.json
          fi
      # The bundle for Google Play, the APK to install by hand.
      - uses: actions/upload-artifact@v7
        if: env.RELEASE == 'true'
        with:
          name: ${{ matrix.app }}-android
          path: |
            apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

  ios:
    strategy:
      fail-fast: false
      matrix:
        app: [partner, customer]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned: signing needs the Apple account's certificates.
      - name: iOS
        working-directory: apps/${{ matrix.app }}
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: >-
          flutter build ios --release --no-codesign --build-number="$BUILD_NUMBER"
          --dart-define-from-file=config/prod.json
