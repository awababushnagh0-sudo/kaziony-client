name: stellar
description: "Design system: component contracts, Material kit, theme tokens, forms."
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  dev_menu: any
  kernel:
    path: ../kernel
  reactive_forms: ^18.2.2
  cached_network_image: ^3.4.1
  google_maps_flutter: ^2.19.0
  maplibre_gl: ^0.27.1
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  # The brand's pictures (SIllustrations), with their 2.0x and 3.0x versions,
  # other companies' marks their own rules require on buttons
  # (SSignInButton), and the pin of SMapPicker.
  assets:
    - assets/illustrations/
    - assets/brands/
    - assets/map/
  # IBM Plex Sans Arabic (OFL.txt) covers Arabic and Latin. Lucide (Lucide-LICENSE.txt)
  # is the icon set ERPNext uses: only its thin 300 weight, so the web app
  # downloads one icon font instead of seven.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide-Light.ttf
